site_name: SEA-FORWARD
docs_dir: docs
theme:
  name: rtd-dropdown
  custom_dir: overrides
  logo: assets/sf.png
  features:
    - navigation.collapse
    #- navigation.top
    - navigation.instant
    - navigation.footer
    #- content.code.copy
    #- navigation.footer

#extra:
#  social:
#    - icon: material/file-pdf-box
#      link: /pdf/documentation.pdf
#      name: Télécharger en PDF

extra:
  footer: |
    <div style="text-align:center; padding:10px;">
      <img src="/img/mooc.png" alt="SEA-FORWARD Footer Logo" height="40">
      <p>© {{ now().year }} SEA-FORWARD — Documentation générée avec MkDocs</p>
    </div>

hooks:
  - hooks.py

extra_css:
  - css/syntax_custom.css
  - css/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css
  #- https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap
  - https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap

extra_javascript:
  - javascripts/copy-button.js
  - javascripts/sidebar.js
  - javascripts/download-button.js

plugins:
  #- with-pdf:
  #    output_path: pdf/documentation.pdf
  #    cover_title: "SEA-FORWARD Documentation"
  #    cover_subtitle: "Data Download Guide"
  #    author: "Opera SeaForward Team"
  #    toc_level: 2
  #    enabled_if_env: ENABLE_PDF
  #- print-site:
  #    add_to_navigation: true
  #    print_page_title: "Télécharger en PDF"
  #    print_page_description: "Exporter cette page en PDF"
  #    enabled_if_env: ENABLE_PRINT
  - search:
      lang: en
      separator: '[\s\-\.]+'

markdown_extensions:
  - toc:
      toc_depth: 0
  - admonition
  - pymdownx.highlight:
      linenums: true # affiche les numéros de ligne
      linenums_style: pymdownx-inline
      anchor_linenums: true # permet de cibler une ligne précise
      use_pygments: true # coloration syntaxique via Pygments
      auto_title: true # affiche le langage en haut du bloc
      guess_lang: false # évite les mauvaises détections
  - pymdownx.superfences # gère les blocs imbriqués et multi-langages
  - pymdownx.inlinehilite # coloration inline avec `==code==`
  - pymdownx.snippets # inclure des extraits externes
  - pymdownx.extra # ajoute des fonctionnalités utiles
  - pymdownx.details # permet de créer des blocs repliables (accordéons)
  - pymdownx.tabbed # permet de créer des onglets pour organiser le contenu

